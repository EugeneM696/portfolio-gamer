<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>REST API через Fetch – ЛР8</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="api.css" />
<script src="api.js" defer></script>
</head>
<body>
<header>
<h1>Портфоліо – Геймерський блог</h1>
<nav>
<a href="index.html">Головна (Портфоліо)</a>
<a href="dashboard.html">Дашборд</a>
<a href="lab6.html">Конвертер і каталог</a>
<a href="todo.html">Список задач</a>
<a href="api.html">Робота з API</a>
</nav>
</header>
<main class="app">
<section id="api-section">
<h2 id="app-title">Енциклопедія покемонів</h2>
<form id="search-form" novalidate>
<label for="query-input" id="query-label">Введіть назву покемона(англ.) або його номер</label>
<input
id="query-input"
type="search"
maxlength="60"
autocomplete="off"
placeholder="Наприклад, Pikachu або 25" />
<button type="submit" id="submit-btn">Знайти</button>
</form>
<p id="form-error" class="error" role="alert"></p>
<!-- Контейнер для додаткової функції Г (Обране в localStorage) -->
<div id="favorites-box" class="favorites-box" hidden>
<h3>Обране</h3>
<ul id="favorites-list" class="places"></ul>
</div>
<!-- Область відображення станів loading / empty / error -->
<div id="status" role="status" aria-live="polite"></div>
<!-- Проміжний список вибору (наприклад, знайдені однойменні міста) -->
<ul id="places" class="places"></ul>
<!-- Основний контейнер результатів з API -->
<section id="result" aria-live="polite"></section>
<!-- Кнопка для додаткової функції А (Пагінація «Показати ще») -->
<div class="pagination-box">
<button type="button" id="load-more-btn" hidden>Показати ще</button>
</div>
</section>
</main>
<footer>
<p>&copy; 2026 Навчальний проєкт. Лабораторна робота №8 (Fetch API).</p>
</footer>
</body>
</html>
